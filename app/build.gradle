plugins {
    id 'com.android.application'
}

def buildRevision = project.findProperty("buildRevision") ?: "dev"
def buildDate = project.findProperty("buildDate") ?: "unknown"

android {
    namespace 'com.example.storagereader'
    compileSdk 34
    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.example.storagereader"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        buildConfigField "String", "BUILD_REVISION", "\"${buildRevision}\""
        buildConfigField "String", "BUILD_DATE", "\"${buildDate}\""
        manifestPlaceholders = [buildRevision: buildRevision, buildDate: buildDate]

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    if (System.getenv("ANDROID_DEBUG_KEYSTORE")) {
        signingConfigs {
            debug {
                storeFile file(System.getenv("ANDROID_DEBUG_KEYSTORE"))
                storePassword System.getenv("ANDROID_DEBUG_KEYSTORE_PASSWORD")
                keyAlias "androiddebugkey"
                keyPassword System.getenv("ANDROID_DEBUG_KEYSTORE_PASSWORD")
            }
        }
    }
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.work:work-runtime:2.9.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
